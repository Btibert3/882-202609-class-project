version: 2

models:
  - name: deal_features
    description: "Feature table for binary classification: did a deal result in a signed contract? One row per deal. Built from stg_deals joined with activity signals from int_deal_activities. This is the dataset used to train the deal won/lost ML model."
    meta:
      owner: analytics-eng
      domain: ai
    columns:
      - name: deal_id
        description: "Unique deal identifier. Primary key."
        tests:
          - unique
          - not_null
      - name: is_won
        description: "Binary classification target: 1 if the deal resulted in a signed contract (contract_id is not null), 0 otherwise."
      - name: stage_name
        description: "Pipeline stage at the time the feature snapshot was taken."
      - name: amount
        description: "Estimated deal value in USD."
      - name: probability
        description: "Rep-estimated close probability as a percentage."
      - name: activity_count
        description: "Total number of rep activities logged against this deal — a proxy for rep engagement."
      - name: days_since_last_activity
        description: "Days between the most recent activity and the feature snapshot date. High values suggest a stalled deal."
